spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    username: admin
    password: admin
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

rabbitmq:
  host: localhost
  # port: 5672
  # username: myuser
  # password: secret

digidine:
  broker:
    exchange:
      productionNotificationExchange: digidine.order-production.notification  # para consumo interno (ProductionListener)
      orderUpdateExchange: digidine.order-update.notification                # para notificar o Order
    key:
      productionNotificationKey: ms.order-production.notification             # para consumo interno
      orderUpdateKey: ms.order-update.notification                            # para notificar o Order
    queue:
      production: digidine.production.notification.queue